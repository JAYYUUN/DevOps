# 필수 입력: 아래 CHANGE_ME 키와 값을 README의 CSP별 내부 LB 설정으로 교체합니다.
gateway:
  serviceAnnotations:
    CHANGE_ME: "CHANGE_ME"

tls:
  validDays: 365

# GitLab 저장소를 연결할 때만 활성화합니다. 초기 설치에는 입력하지 않아도 됩니다.
repository:
  enabled: false
  url: ""
  username: ""
  token: ""

argocd:
  fullnameOverride: argocd
  global:
    domain: argocd.internal
  crds:
    install: true
    keep: true
  configs:
    params:
      # 외부 HTTPS는 Gateway에서 처리. Gateway → 서버는 내부 HTTP입니다.
      server.insecure: true
    tls:
      # GitLab 자체 서명 CA는 README의 저장소 연결 절차에서 등록합니다.
      certificates: {}
  server:
    replicas: 1
    service:
      type: ClusterIP
    ingress:
      enabled: false
    httproute:
      enabled: true
      parentRefs:
        - name: argocd-gateway
          sectionName: https
      hostnames:
        - argocd.internal
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  controller:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  # Argo CD 전용 Redis 캐시. 외부 Redis·PVC는 사용하지 않습니다.
  redis:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  redis-ha:
    enabled: false
  dex:
    enabled: false
  applicationSet:
    replicas: 0
  notifications:
    enabled: false

envoy-gateway:
  crds:
    enabled: false
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/argocd-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
