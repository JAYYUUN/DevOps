{{- $class := printf "%s-%s-gateway-class" .Release.Namespace .Release.Name -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: argocd-proxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        {{- with .Values.gateway.serviceAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $class | quote }}
spec:
  controllerName: {{ index .Values "envoy-gateway" "config" "envoyGateway" "gateway" "controllerName" | quote }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: argocd-proxy
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-gateway
spec:
  gatewayClassName: {{ $class | quote }}
  listeners:
    - name: https
      hostname: {{ .Values.argocd.global.domain | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
