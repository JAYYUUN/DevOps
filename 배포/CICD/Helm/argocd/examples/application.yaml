# 설치만으로 배포되지 않습니다. 저장소 연결 후 값을 수정하고 별도 적용합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.internal/CHANGE_ME/deploy.git
    targetRevision: main
    path: CHANGE_ME
  destination:
    server: https://kubernetes.default.svc
    namespace: CHANGE_ME
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
# 자동 동기화·자동 삭제는 설정하지 않았습니다. 최초 배포는 UI에서 Sync합니다.
