# 볼륨의 CHANGE_ME 세 개와 gateway.serviceAnnotations의 키·값을 변경합니다.
volume:
  driver: CHANGE_ME       # NHN: cinder.csi.openstack.org / AWS: ebs.csi.aws.com
  volumeHandle: CHANGE_ME # 기존 Jenkins 전용 볼륨 UUID 또는 EBS 볼륨 ID
  zone: CHANGE_ME         # 실제 볼륨 AZ. NHN 현재 노드 예: kr-pub-a (KR1 아님)
  size: 20Gi
  fsType: ext4

tls:
  validDays: 365

gateway:
  # README의 CSP별 예시로 아래 키와 값을 모두 교체합니다.
  serviceAnnotations:
    CHANGE_ME: "CHANGE_ME"

jenkins:
  fullnameOverride: jenkins
  persistence:
    enabled: true
    existingClaim: jenkins-home
  controller:
    numExecutors: 0
    serviceType: ClusterIP
    jenkinsUrl: https://jenkins.internal
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      reuseIngressConfiguration: false
      parentRefs:
        - name: jenkins-gateway
          sectionName: https
      hostnames:
        - jenkins.internal
    admin:
      username: admin
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    javaOpts: "-Xms512m -Xmx1024m"
  agent:
    enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

envoy-gateway:
  crds:
    enabled: false
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/jenkins-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
