loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: ''
      size: 10Gi
    initContainers:
    - name: fix-loki-volume-permissions
      image: busybox:1.36
      command:
      - sh
      - -c
      - 'chown -R 10001:10001 /var/loki

        chmod -R u+rwX,g+rwX /var/loki

        '
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      volumeMounts:
      - name: storage
        mountPath: /var/loki
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  minio:
    enabled: false
