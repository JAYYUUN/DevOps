apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JAYYUUN/DevOps.git
    targetRevision: main
    path: 배포/k8s-observability-reusable/charts/fluentd
    helm:
      releaseName: fluentd
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
