{{- /* Reject incomplete environment configuration before contacting a cluster. */ -}}
{{- range $path, $value := dict
  "global.hosts.domain" .Values.global.hosts.domain
  "global.psql.host" .Values.global.psql.host
  "global.redis.host" .Values.global.redis.host
  "global.redis.cache.host" .Values.global.redis.cache.host
  "gitalyVolume.csi.driver" .Values.gitalyVolume.csi.driver
  "gitalyVolume.csi.volumeHandle" .Values.gitalyVolume.csi.volumeHandle
  "gitalyVolume.csi.fsType" .Values.gitalyVolume.csi.fsType
  "gitalyVolume.pvName" .Values.gitalyVolume.pvName
-}}
{{- if or (empty $value) (contains "CHANGE_ME" (toString $value)) -}}
{{- fail (printf "%s: set an actual environment value in values.yaml" $path) -}}
{{- end -}}
{{- end -}}
{{- if contains "CHANGE_ME" (toJson .Values.gitalyVolume.nodeAffinity) -}}
{{- fail "gitalyVolume.nodeAffinity: use the real topology label and zone" -}}
{{- end -}}
{{- if and .Values.global.ingress.enabled (or (empty .Values.global.ingress.class) (eq .Values.global.ingress.class "CHANGE_ME")) -}}
{{- fail "global.ingress.class: set an existing IngressClass" -}}
{{- end -}}
{{- if not .Values.upstream.gitlab.gitaly.persistence.enabled -}}{{- fail "Gitaly persistence must remain enabled" -}}{{- end -}}
{{- if empty .Values.upstream.gitlab.gitaly.persistence.storageClass -}}{{- fail "Gitaly storageClass must be explicit; use '-' for no class" -}}{{- end -}}
{{- if empty .Values.upstream.gitlab.gitaly.persistence.matchLabels -}}{{- fail "Gitaly PV selector labels must not be empty" -}}{{- end -}}
{{- if ne (toJson .Values.global.gitaly.internal.names) "[\"default\"]" -}}{{- fail "This chart supports a single default Gitaly storage; add volumes before changing storage topology" -}}{{- end -}}
{{- if or (not .Values.global.gitaly.enabled) .Values.global.praefect.enabled -}}{{- fail "This chart requires internal non-Cluster Gitaly" -}}{{- end -}}
