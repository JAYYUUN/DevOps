# 인증값은 이 파일이 아니라 values.yaml의 secrets에 입력합니다.
{{ if .Values.secrets.postgresql.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.psql.password.secret | quote }}
type: Opaque
stringData:
  {{ .Values.global.psql.password.key | quote }}: {{ required "secrets.postgresql.password: 실제 비밀번호를 입력하세요" .Values.secrets.postgresql.password | quote }}
{{ end }}
{{ if .Values.secrets.redisPersistent.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.redis.auth.secret | quote }}
type: Opaque
stringData:
  {{ .Values.global.redis.auth.key | quote }}: {{ required "secrets.redisPersistent.password: 실제 비밀번호를 입력하세요" .Values.secrets.redisPersistent.password | quote }}
{{ end }}
{{ if .Values.secrets.redisCache.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.redis.cache.password.secret | quote }}
type: Opaque
stringData:
  {{ .Values.global.redis.cache.password.key | quote }}: {{ required "secrets.redisCache.password: 실제 비밀번호를 입력하세요" .Values.secrets.redisCache.password | quote }}
{{ end }}
{{ if .Values.secrets.objectStorage.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.appConfig.object_store.connection.secret | quote }}
type: Opaque
stringData:
  {{ .Values.global.appConfig.object_store.connection.key | quote }}: |
    provider: AWS
    region: {{ .Values.secrets.objectStorage.region | quote }}
    aws_access_key_id: {{ .Values.secrets.objectStorage.accessKey | quote }}
    aws_secret_access_key: {{ .Values.secrets.objectStorage.secretKey | quote }}
    endpoint: {{ .Values.secrets.objectStorage.endpoint | quote }}
    path_style: {{ .Values.secrets.objectStorage.pathStyle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.registry.storage.secret | quote }}
type: Opaque
stringData:
  {{ .Values.upstream.registry.storage.key | quote }}: |
    s3:
      accesskey: {{ .Values.secrets.objectStorage.accessKey | quote }}
      secretkey: {{ .Values.secrets.objectStorage.secretKey | quote }}
      bucket: {{ .Values.global.registry.bucket | quote }}
      region: {{ .Values.secrets.objectStorage.region | quote }}
      regionendpoint: {{ .Values.secrets.objectStorage.endpoint | quote }}
      secure: true
      v4auth: true
      pathstyle: {{ .Values.secrets.objectStorage.pathStyle }}
    redirect:
      disable: true
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.gitlab.toolbox.backups.objectStorage.config.secret | quote }}
type: Opaque
stringData:
  {{ .Values.upstream.gitlab.toolbox.backups.objectStorage.config.key | quote }}: |
    [default]
    access_key = {{ .Values.secrets.objectStorage.accessKey }}
    secret_key = {{ .Values.secrets.objectStorage.secretKey }}
    host_base = {{ (urlParse .Values.secrets.objectStorage.endpoint).host }}
    host_bucket = {{ ternary (urlParse .Values.secrets.objectStorage.endpoint).host (printf "%%(bucket)s.%s" (urlParse .Values.secrets.objectStorage.endpoint).host) .Values.secrets.objectStorage.pathStyle }}
    use_https = True
    bucket_location = {{ .Values.secrets.objectStorage.region }}
    signature_v2 = False
{{ end }}
{{ if .Values.secrets.customCA.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.customCA.name | quote }}
type: Opaque
stringData:
  ca.crt: {{ .Values.secrets.customCA.certificate | quote }}
{{ end }}
