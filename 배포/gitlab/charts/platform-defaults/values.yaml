exports:
  settings:
    global:
      edition: ce
      hosts:
        domain: internal
        https: true
      ingress:
        enabled: true
        provider: nginx
        class: none
        configureCertmanager: false
        tls:
          enabled: true
          secretName: ''
      gatewayApi:
        enabled: false
        installEnvoy: false
        configureEnvoy: false
        configureCertmanager: false
      extraEnv:
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      certificates:
        customCAs: []
      psql:
        host: CHANGE_ME
        port: 5432
        username: gitlab
        database: gitlabhq_production
        password:
          secret: gitlab-external-postgresql
          key: password
      redis:
        host: CHANGE_ME
        port: 6379
        scheme: redis
        auth:
          enabled: true
          secret: gitlab-external-redis-persistent
          key: password
      registry:
        bucket: gitlab-registry
      appConfig:
        object_store:
          enabled: true
          proxy_download: true
          connection:
            secret: gitlab-external-object-storage
            key: connection
        lfs:
          enabled: true
          bucket: gitlab-lfs
        artifacts:
          enabled: true
          bucket: gitlab-artifacts
        uploads:
          enabled: true
          bucket: gitlab-uploads
        packages:
          enabled: true
          bucket: gitlab-packages
        backups:
          bucket: gitlab-backups
          tmpBucket: gitlab-backup-tmp
      gitaly:
        enabled: true
        internal:
          names:
          - default
      praefect:
        enabled: false
      kas:
        enabled: false
    gitalyVolume:
      pvName: gitlab-gitaly-existing
      csi:
        driver: CHANGE_ME
        volumeHandle: CHANGE_ME
        fsType: CHANGE_ME
        volumeAttributes: {}
      mountOptions: []
      zone: CHANGE_ME
    upstream:
      installCertmanager: false
      nginx-ingress:
        enabled: false
      prometheus:
        install: false
      gitlab-runner:
        install: false
      registry:
        enabled: true
        hpa:
          minReplicas: 2
          maxReplicas: 2
        storage:
          secret: gitlab-external-registry-storage
          key: config
        database:
          enabled: false
      gitlab:
        webservice:
          minReplicas: 2
          maxReplicas: 2
        sidekiq:
          minReplicas: 2
          maxReplicas: 2
        gitlab-shell:
          minReplicas: 2
          maxReplicas: 2
        gitaly:
          persistence:
            enabled: true
            size: 50Gi
            accessMode: ReadWriteOnce
            storageClass: gitlab-static
            matchLabels:
              gitlab-storage-role: gitaly-default
          resources:
            requests:
              cpu: '2'
              memory: 8Gi
            limits:
              cpu: '2'
              memory: 8Gi
          cgroups:
            enabled: true
            memoryBytes: 7516192768
            repositories:
              count: 1
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        toolbox:
          backups:
            objectStorage:
              backend: s3
              config:
                secret: gitlab-external-backup-storage
                key: config
            cron:
              enabled: true
              schedule: 0 18 * * *
    secrets:
      postgresql:
        create: true
        password: CHANGE_ME
      redisPersistent:
        create: true
        password: CHANGE_ME
      objectStorage:
        create: true
        accessKey: CHANGE_ME
        secretKey: CHANGE_ME
        region: CHANGE_ME
        endpoint: https://CHANGE_ME
        pathStyle: true
      customCA:
        create: false
        name: gitlab-external-ca
        certificate: ''
    bucketSetup:
      enabled: true
      image: registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce:v19.5.1
