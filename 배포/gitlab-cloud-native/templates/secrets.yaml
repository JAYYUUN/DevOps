{{- define "platform.secretValue" -}}
{{- if or (empty .value) (contains "CHANGE_ME" (toString .value)) -}}
{{- fail (printf "%s: enter the actual credential, or set create=false to use an existing Secret" .path) -}}
{{- end -}}
{{- .value -}}
{{- end -}}
{{- $passwords := list
 (dict "settings" .Values.secrets.postgresql "ref" .Values.global.psql.password "path" "secrets.postgresql.password")
 (dict "settings" .Values.secrets.redisPersistent "ref" .Values.global.redis.auth "path" "secrets.redisPersistent.password")
 (dict "settings" .Values.secrets.redisCache "ref" .Values.global.redis.cache.password "path" "secrets.redisCache.password") -}}
{{- range $p := $passwords -}}
{{- if $p.settings.create }}
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $p.ref.secret | quote }}
type: Opaque
stringData:
  {{ $p.ref.key | quote }}: {{ include "platform.secretValue" (dict "path" $p.path "value" $p.settings.password) | quote }}
{{- end -}}
{{- end -}}
{{- $s := .Values.secrets.objectStorage -}}
{{- if $s.create -}}
{{- $ak := include "platform.secretValue" (dict "path" "secrets.objectStorage.accessKey" "value" $s.accessKey) -}}
{{- $sk := include "platform.secretValue" (dict "path" "secrets.objectStorage.secretKey" "value" $s.secretKey) -}}
{{- $region := include "platform.secretValue" (dict "path" "secrets.objectStorage.region" "value" $s.region) -}}
{{- $endpoint := include "platform.secretValue" (dict "path" "secrets.objectStorage.endpoint" "value" $s.endpoint) -}}
{{- $url := urlParse $endpoint -}}
{{- if or (ne $url.scheme "https") (empty $url.host) -}}{{- fail "Object Storage endpoint must be an https:// URL" -}}{{- end -}}
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.appConfig.object_store.connection.secret | quote }}
type: Opaque
stringData:
  {{ .Values.global.appConfig.object_store.connection.key | quote }}: |
    provider: AWS
    region: {{ $region | quote }}
    aws_access_key_id: {{ $ak | quote }}
    aws_secret_access_key: {{ $sk | quote }}
    endpoint: {{ $endpoint | quote }}
    path_style: {{ $s.pathStyle }}
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.registry.storage.secret | quote }}
type: Opaque
stringData:
  {{ .Values.upstream.registry.storage.key | quote }}: |
    s3:
      accesskey: {{ $ak | quote }}
      secretkey: {{ $sk | quote }}
      bucket: {{ .Values.global.registry.bucket | quote }}
      region: {{ $region | quote }}
      regionendpoint: {{ $endpoint | quote }}
      secure: true
      v4auth: true
      pathstyle: {{ $s.pathStyle }}
    redirect:
      disable: true
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.gitlab.toolbox.backups.objectStorage.config.secret | quote }}
type: Opaque
stringData:
  {{ .Values.upstream.gitlab.toolbox.backups.objectStorage.config.key | quote }}: |
    [default]
    access_key = {{ $ak }}
    secret_key = {{ $sk }}
    host_base = {{ $url.host }}
    host_bucket = {{ ternary $url.host (printf "%%(bucket)s.%s" $url.host) $s.pathStyle }}
    use_https = True
    bucket_location = {{ $region }}
    signature_v2 = False
{{- end -}}
{{- if .Values.secrets.tls.create }}
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.ingress.tls.secretName | quote }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ include "platform.secretValue" (dict "path" "secrets.tls.certificate" "value" .Values.secrets.tls.certificate) | quote }}
  tls.key: {{ include "platform.secretValue" (dict "path" "secrets.tls.privateKey" "value" .Values.secrets.tls.privateKey) | quote }}
{{- end -}}
{{- if .Values.secrets.customCA.create }}
{{ printf "\n" }}---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.customCA.name | quote }}
type: Opaque
stringData:
  ca.crt: {{ include "platform.secretValue" (dict "path" "secrets.customCA.certificate" "value" .Values.secrets.customCA.certificate) | quote }}
{{- end }}
