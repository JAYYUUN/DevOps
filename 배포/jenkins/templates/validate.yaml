{{- range $key := list "driver" "volumeHandle" "zone" -}}
{{- $value := index $.Values.volume $key -}}
{{- if or (empty $value) (contains "CHANGE_ME" $value) -}}
{{- fail (printf "volume.%s: 기존 Jenkins 볼륨의 실제 값을 입력하세요" $key) -}}
{{- end -}}
{{- end -}}
{{- if not (has .Values.volume.fsType (list "ext4" "xfs")) -}}
{{- fail "volume.fsType: ext4 또는 xfs를 지정하세요" -}}
{{- end -}}
{{- if or (not .Values.jenkins.persistence.enabled) (ne .Values.jenkins.persistence.existingClaim "jenkins-home") -}}
{{- fail "jenkins.persistence는 enabled=true, existingClaim=jenkins-home으로 유지하세요" -}}
{{- end -}}
{{- $route := .Values.jenkins.controller.httpRoute -}}
{{- if or (not $route.enabled) $route.reuseIngressConfiguration (ne (len $route.hostnames) 1) -}}
{{- fail "httpRoute: enabled=true, reuseIngressConfiguration=false, hostnames는 도메인 하나를 지정하세요" -}}
{{- end -}}
{{- if ne (toJson $route.parentRefs) (toJson (list (dict "name" "jenkins-gateway" "sectionName" "https"))) -}}
{{- fail "httpRoute.parentRefs는 이 모듈의 jenkins-gateway/https 연결을 유지하세요" -}}
{{- end -}}
{{- if .Values.jenkins.controller.ingress.enabled -}}
{{- fail "이 모듈은 Gateway API를 사용하므로 controller.ingress.enabled=false로 유지하세요" -}}
{{- end -}}
{{- if ne .Values.jenkins.controller.jenkinsUrl (printf "https://%s" (first $route.hostnames)) -}}
{{- fail "controller.jenkinsUrl과 httpRoute.hostnames 도메인을 일치시키세요" -}}
{{- end -}}
{{- if (index .Values "envoy-gateway" "crds" "enabled") -}}
{{- fail "CRD는 클러스터 공통으로 관리하므로 envoy-gateway.crds.enabled=false로 유지하세요" -}}
{{- end -}}
{{- $controller := index .Values "envoy-gateway" "config" "envoyGateway" "gateway" "controllerName" -}}
{{- if or (empty $controller) (eq $controller "gateway.envoyproxy.io/gitlab-gatewayclass-controller") (eq $controller "gateway.envoyproxy.io/gatewayclass-controller") -}}
{{- fail "Envoy controllerName은 다른 모듈과 겹치지 않는 전용 값으로 지정하세요" -}}
{{- end -}}
{{- if lt (int .Values.tls.validDays) 1 -}}
{{- fail "tls.validDays는 1 이상이어야 합니다" -}}
{{- end -}}
