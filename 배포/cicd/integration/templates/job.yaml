apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cicd.name" . }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: {{ include "cicd.name" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          command: [python, /config/bootstrap.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-bootstrap" (include "cicd.name" .)) .Values.gitlab.existingSecret }}
                  key: api-token
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "cicd.name" . }}-config
        - name: tmp
          emptyDir: {}
