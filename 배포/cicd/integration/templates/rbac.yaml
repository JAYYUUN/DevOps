apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cicd.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cicd.name" . }}-state
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-state" (include "cicd.name" .) | quote }}]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cicd.name" . }}-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cicd.name" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "cicd.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-admin-read
  namespace: {{ .Values.jenkins.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.jenkins.adminSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-admin-read
  namespace: {{ .Values.jenkins.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-admin-read
subjects:
  - kind: ServiceAccount
    name: {{ include "cicd.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-argocd
  namespace: {{ .Values.argocd.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-repository" .Values.argocd.applicationName | quote }}]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    resourceNames: [{{ .Values.argocd.applicationName | quote }}]
    verbs: [get, update]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-argocd
  namespace: {{ .Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-argocd
subjects:
  - kind: ServiceAccount
    name: {{ include "cicd.name" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-pull
  namespace: {{ .Values.deployment.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-pull" (include "cicd.name" .) | quote }}]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cicd.name" . }}-pull
  namespace: {{ .Values.deployment.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cicd.name" . }}-{{ .Release.Namespace }}-pull
subjects:
  - kind: ServiceAccount
    name: {{ include "cicd.name" . }}
    namespace: {{ .Release.Namespace }}
