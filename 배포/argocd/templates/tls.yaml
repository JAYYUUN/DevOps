{{- $name := "argocd-gateway-tls" -}}
{{- $host := .Values.argocd.global.domain -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
{{- if ne (index (default dict $existing.metadata.annotations) "argocd-platform/hostname") $host -}}
{{- fail "도메인이 변경됐습니다. README의 인증서 교체 절차를 적용하세요" -}}
{{- end -}}
{{- range $key := list "tls.crt" "tls.key" "ca.crt" -}}
{{- if empty (index $existing.data $key) -}}{{- fail (printf "기존 TLS Secret에 %s가 없습니다" $key) -}}{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
    argocd-platform/hostname: {{ $host | quote }}
type: kubernetes.io/tls
{{ if $existing -}}
data:
  tls.crt: {{ index $existing.data "tls.crt" | quote }}
  tls.key: {{ index $existing.data "tls.key" | quote }}
  ca.crt: {{ index $existing.data "ca.crt" | quote }}
{{ else -}}
{{- $ca := genCA "argocd-local-ca" (int .Values.tls.validDays) -}}
{{- $cert := genSignedCert $host nil (list $host) (int .Values.tls.validDays) $ca -}}
data:
  tls.crt: {{ printf "%s\n%s" $cert.Cert $ca.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
{{ end -}}
