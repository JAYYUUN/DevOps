<match kubernetes.**>
  @type loki
  url http://loki-gateway.observability.svc.cluster.local
  line_format json
  <label>
    job fluentd
    namespace $.namespace
    pod $.pod
    container $.container
  </label>
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 5s
    retry_forever true
    retry_max_interval 30s
  </buffer>
</match>
