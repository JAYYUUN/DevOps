# 원본 values/*.yaml 설정을 병합한 기본 설정입니다. 별도 -f 없이 적용됩니다.
# values/*.yaml은 선택적 기능별 오버라이드입니다. 수정 시 values.yaml도 동기화하세요.
fluentd:
  kind: DaemonSet
  mountVarLogDirectory: true
  mountDockerContainersDirectory: false
  serviceAccount:
    create: true
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  plugins:
  - fluent-plugin-grafana-loki
  - fluent-plugin-prometheus
  - fluent-plugin-kubernetes_metadata_filter
  livenessProbe:
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /metrics
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  extraFilesConfigMapNameOverride: fluentd-wrapper-files
  fileConfigs: {}
