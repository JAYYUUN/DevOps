# Tempo Wrapper Chart
# Single instance + S3 Trace Storage + Persistent WAL

tempo:
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    retention: 24h

    storage:
      trace:
        # Trace 데이터는 S3 Object Storage에 저장
        backend: s3

        s3:
          bucket: "YOUR_TEMPO_BUCKET"
          endpoint: "YOUR_S3_ENDPOINT"
          region: "YOUR_REGION"
          insecure: false

        # S3 업로드 전 WAL 저장 경로
        wal:
          path: /var/tempo/wal

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # WAL 데이터를 위한 PVC
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
