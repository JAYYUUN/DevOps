
# Tempo Wrapper Chart
# Single Binary + S3 Object Storage + WAL PVC

tempo:
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    retention: 24h

    storage:
      trace:
        # Trace 데이터는 S3 Object Storage에 저장
        backend: s3

        s3:
          bucket: "YOUR_TEMPO_BUCKET"
          endpoint: "YOUR_REGION"
          region: "YOUR_REGION"
          insecure: false

        # S3 업로드 전 WAL 저장 경로
        wal:
          path: /var/tempo/wal

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # WAL 데이터를 위한 PVC
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi

  # Tempo 실행 계정
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    runAsNonRoot: true

  # PVC 권한 설정용 InitContainer
  initContainers:
    - name: init-storage-permissions
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /var/tempo/wal
          chown -R 10001:10001 /var/tempo
          chmod -R u+rwX,g+rwX /var/tempo
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage
          mountPath: /var/tempo
