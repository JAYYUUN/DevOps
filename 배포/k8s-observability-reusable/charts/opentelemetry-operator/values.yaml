opentelemetry-operator:
  replicaCount: 1
  manager:
    collectorImage:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  admissionWebhooks:
    create: true
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
