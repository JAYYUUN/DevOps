# 원본 values/*.yaml 설정을 병합한 기본 설정입니다. 별도 -f 없이 적용됩니다.
# values/*.yaml은 선택적 기능별 오버라이드입니다. 수정 시 values.yaml도 동기화하세요.
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: loki-test
        ruler: loki-test
        admin: loki-test
      s3:
        s3ForcePathStyle: true
        insecure: false
    limits_config:
      allow_structured_metadata: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: ''
      size: 10Gi
    initContainers:
    - name: fix-loki-volume-permissions
      image: busybox:1.36
      command:
      - sh
      - -c
      - 'chown -R 10001:10001 /var/loki

        chmod -R u+rwX,g+rwX /var/loki

        '
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      volumeMounts:
      - name: storage
        mountPath: /var/loki
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  minio:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
