apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-system-filter
  namespace: logging
data:
  50-system-filter.conf: |
    filter {
      if [@metadata][log_kind] == "system" {
        mutate {
          copy => { "message" => "body" }
          add_field => { "logSource" => "linux" "logType" => "syslog" }
        }
        if [path] =~ /\/(auth\.log|secure)$/ {
          mutate { replace => { "logType" => "auth" } }
        }

        # Ubuntu/Debian 및 RHEL 계열의 전형적인 syslog 헤더
        grok {
          match => {
            "message" => [
              "^%{SYSLOGTIMESTAMP:[@metadata][syslogTime]} %{HOSTNAME:[@metadata][syslogHost]} %{DATA:processName}(?:\[%{POSINT:[@metadata][pid]}\])?: %{GREEDYDATA:[@metadata][syslogText]}$",
              "^%{TIMESTAMP_ISO8601:[@metadata][syslogTime]} %{HOSTNAME:[@metadata][syslogHost]} %{DATA:processName}(?:\[%{POSINT:[@metadata][pid]}\])?: %{GREEDYDATA:[@metadata][syslogText]}$"
            ]
          }
          tag_on_failure => []
        }

        if [logType] == "auth" {
          grok {
            match => {
              "body" => [
                "Accepted %{WORD:[@metadata][authMethod]} for %{USERNAME:userName} from %{IP:sourceIp}",
                "Failed %{WORD:[@metadata][authMethod]} for (?:invalid user )?%{USERNAME:userName} from %{IP:sourceIp}"
              ]
            }
            tag_on_failure => []
          }
          if [body] =~ /Accepted .* for / {
            mutate { add_field => { "eventOutcome" => "success" } }
          } else if [body] =~ /Failed .* for / {
            mutate { add_field => { "eventOutcome" => "failure" } }
          }
        }

        mutate { remove_field => ["message", "path", "host"] }
      }
    }
