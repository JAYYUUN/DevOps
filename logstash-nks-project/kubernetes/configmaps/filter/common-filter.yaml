apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-common-filter
  namespace: logging
data:
  70-common-filter.conf: |
    filter {
      # 원본 파싱 실패 시에도 본문은 반드시 남긴다.
      if ![body] and [message] {
        mutate { copy => { "message" => "body" } }
      }

      mutate {
        add_field => {
          "sourceHost" => "${NODE_NAME}"
          "projectName" => "${NHN_LNC_APPKEY}"
          "projectVersion" => "1.0.0"
          "logVersion" => "v2"
          "timestamp" => "%{@timestamp}"
        }
      }

      # NHN 사용자 정의 필드명은 영문자로 시작해야 한다.
      # Logstash 내부 키 및 수집기 내부 필드는 외부 전송에서 제외.
      mutate {
        remove_field => [
          "message", "path", "host", "tags",
          "@version", "@timestamp", "event", "log", "agent", "ecs",
          "input", "fields"
        ]
      }
    }
