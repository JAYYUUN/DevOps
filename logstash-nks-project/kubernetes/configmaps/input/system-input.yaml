apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-system-input
  namespace: logging
data:
  20-system-input.conf: |
    input {
      file {
        id => "system-os"
        path => [
          "/host/var/log/auth.log",
          "/host/var/log/secure",
          "/host/var/log/syslog",
          "/host/var/log/messages"
        ]
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/sincedb/system"
        add_field => { "[@metadata][log_kind]" => "system" }
      }
    }
