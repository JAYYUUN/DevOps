apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-nhn-output
  namespace: logging
data:
  90-nhn-output.conf: |
    output {
      http {
        id => "nhn-logncrash"
        url => "https://api-logncrash.gov-nhncloudservice.com/v2/log"
        http_method => "post"
        format => "json"
        content_type => "application/json"
        automatic_retries => 1
        retry_non_idempotent => true
        request_timeout => 60
        socket_timeout => 30
      }
    }
