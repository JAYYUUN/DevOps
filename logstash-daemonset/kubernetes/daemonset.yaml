apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logstash-agent
  namespace: logging

spec:
  selector:
    matchLabels:
      app: logstash-agent

  template:
    metadata:
      labels:
        app: logstash-agent

    spec:
      terminationGracePeriodSeconds: 120

      # Pod 기본 보안 설정
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups:
          - 0
          - 4

      # sincedb 디렉터리 생성 (비root)
      initContainers:
        - name: init-logstash-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              set -eu

              echo "Checking Logstash data directory..."
              id
              ls -ld /data

              # sincedb 디렉터리 생성
              mkdir -p /data/sincedb

              echo "Checking sincedb directory..."
              ls -ld /data/sincedb

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: logstash-data
              mountPath: /data

      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          command:
            - /usr/share/logstash/bin/logstash

          args:
            - "-f"
            - "/usr/share/logstash/pipeline"
            - "-w"
            - "1"
            - "--path.settings"
            - "/usr/share/logstash/config"

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: host-logs
              mountPath: /host/var/log
              readOnly: true

            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true

            - name: logstash-data
              mountPath: /usr/share/logstash/data

      volumes:
        - name: host-logs
          hostPath:
            path: /var/log
            type: Directory

        - name: logstash-data
          hostPath:
            path: /var/lib/logstash-agent
            type: DirectoryOrCreate

        - name: pipeline
          projected:
            sources:
              - configMap:
                  name: logstash-container-input
              - configMap:
                  name: logstash-system-input
              - configMap:
                  name: logstash-auditd-input
              - configMap:
                  name: logstash-container-filter
              - configMap:
                  name: logstash-system-filter
              - configMap:
                  name: logstash-auditd-filter
              - configMap:
                  name: logstash-common-filter
              - configMap:
                  name: logstash-stdout-output

              # NHN Cloud 전송 시
              # logstash-stdout-output을
              # logstash-nhn-output으로 교체
