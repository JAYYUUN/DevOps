apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-container-input
  namespace: logging
data:
  10-container-input.conf: |
    input {
      file {
        id => "container-cri"
        path => ["/host/var/log/pods/*/*/*.log"]
        # stdout Output의 자기 로그 재수집을 방지한다.
        exclude => ["*/logging_logstash-agent-*/*/*.log"]
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/sincedb/container"
        add_field => { "[@metadata][log_kind]" => "container" }
      }
    }
