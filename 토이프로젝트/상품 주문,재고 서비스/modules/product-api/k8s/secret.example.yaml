# Copy to secret.yaml, replace values, then apply secret.yaml explicitly.
# Do not apply this example or commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: product-api-secret
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://product_user:CHANGE_ME@mariadb:3306/product?charset=utf8mb4"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  ADMIN_API_KEY: "REPLACE_WITH_RANDOM_ADMIN_KEY"
  INTERNAL_API_KEY: "REPLACE_WITH_DIFFERENT_INTERNAL_KEY"
