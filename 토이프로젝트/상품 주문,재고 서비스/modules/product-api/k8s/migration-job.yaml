apiVersion: batch/v1
kind: Job
metadata:
  name: product-api-migrate-v1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: YOUR_REGISTRY/product-api:1.0.0
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef:
                name: product-api-config
            - secretRef:
                name: product-api-secret
